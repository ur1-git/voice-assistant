# Copy this to config.toml to customize.
[agent]
provider = "codex" # "codex" or "claude"
codex_full_access = false # true runs Codex without sandboxing or approval prompts.
# codex_model = "gpt-6.2-sol"
# codex_reasoning_effort = "low"
working_directory = "." # relative to this config file, or absolute
max_history_turns = 8
max_history_chars = 4000 # Prior conversation only. Set to 0 for a fresh start on every turn.
timeout_seconds = 180

[audio]
device = "auto" # default PipeWire source, or a source node name or serial
max_record_seconds = 30
end_silence_ms = 1000 # Quiet time after speech before sending in wake mode.

[stt]
backend = "whisper_cpp"
model = "models/ggml-small.bin" # relative to this config file, or absolute
language = "en" # Spoken input. Use "auto" for language detection.
timeout_seconds = 90

[tts]
# Used by voice --speak.
model = "models/kokoro-v1.0.onnx"
voices = "models/voices-v1.0.bin"
voice = "af_heart"
language = "en-us"

[wakeword]
# Used by voice --wake.
model = "models/openwakeword/hey_jarvis_v0.1.onnx"
threshold = 0.5
